name: Main CI

on:
  push:
    branches: [ "main", "api-v2" ]
  pull_request:
    branches: [ "main", "api-v2" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Use Node.js 24.x LTS
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: nest/package-lock.json

    - name: Install and Build
      run: |
        cd nest
        npm ci
        npm run build --if-present

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Use Node.js 24.x LTS
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: nest/package-lock.json

    - name: Install Dependencies
      run: |
        cd nest
        npm ci

    - name: Audit Production Dependencies
      run: |
        cd nest
        npm audit --omit=dev --audit-level=critical

    - name: Lint
      run: |
        cd nest
        npm run lint

    - name: Test
      run: |
        cd nest
        npm run test

  container:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Build production image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        cache-from: type=gha
        cache-to: type=gha,mode=max
        context: ./nest
        load: true
        pull: true
        tags: sourcescan-verifier-back:test

    - name: Smoke test runtime tools
      run: |
        docker run --rm --entrypoint node sourcescan-verifier-back:test --version
        docker run --rm --entrypoint near sourcescan-verifier-back:test --version
        docker run --rm --entrypoint docker sourcescan-verifier-back:test --version

    - name: Smoke test DIND and API startup
      run: sh .github/scripts/runtime-smoke.sh sourcescan-verifier-back:test
