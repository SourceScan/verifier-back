services:
  sscan-nest:
    build:
      context: nest
    platform: linux/amd64
    container_name: ${BRANCH_NAME:-main}_sscan-nest
    restart: always
    networks:
      - nwk
    ports:
      - '127.0.0.1:${NEST_PORT}:${NEST_PORT}'
    volumes:
      - ./nest/scripts:/app/scripts
    env_file:
      - .env
    privileged: true

  sscan-ipfs:
    image: ipfs/kubo:v0.40.1@sha256:9c70a3dba0b5f362bf99317a02384a194f5c91cf5388abdb8fe7d64d83dd20bb
    container_name: ${BRANCH_NAME:-main}_sscan-ipfs
    restart: always
    environment:
      - IPFS_PROFILE=server
      - IPFS_PATH=/ipfsdata
      - IPFS_EXTERNAL_IP=${IPFS_EXTERNAL_IP}
      - SWARM_PORT=${SWARM_PORT}
    networks:
      - nwk
    ports:
      - "${SWARM_PORT}:4001"
      - "${SWARM_PORT}:4001/udp"
      - "127.0.0.1:${IPFS_PORT}:5001"
      - "127.0.0.1:${GATE_PORT}:8080"
    volumes:
      - ./docker-data/ipfs:/ipfsdata
      - ./ipfs/001-configure.sh:/container-init.d/001-configure.sh:ro
    healthcheck:
      test: ["CMD", "ipfs", "id", "--format=<id>"]
      interval: 10s
      timeout: 5s
      retries: 5

  sscan-nginx:
    image: nginx:1.30.3-alpine-slim@sha256:d5b51cfc7d55fc7a7bcf4d1d577b9c3738331df56d68f0b1d8ac9795b9470a5a
    container_name: ${BRANCH_NAME:-main}_sscan-nginx
    restart: always
    ports:
      - '${HOST}:${NGINX_PORT}:${NGINX_PORT}'
    networks:
      - nwk
    volumes:
      - ./nginx/:/etc/nginx/templates/
      - ./nginx/scripts/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: /entrypoint.sh
    command: ["nginx", "-g", "daemon off;"]
    environment:
      - NGINX_PORT=${NGINX_PORT}
      - NEST_PORT=${NEST_PORT}
      - GATE_PORT=8080
      - IPFS_PORT=5001
      - IPFS_ADMIN_USER=${IPFS_ADMIN_USER}
      - IPFS_ADMIN_PASS=${IPFS_ADMIN_PASS}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:$${NGINX_PORT}/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      sscan-nest:
        condition: service_healthy
        restart: true
      sscan-ipfs:
        condition: service_healthy
        restart: true

networks:
  nwk:
    name: ${BRANCH_NAME:-main}_nwk
    driver: bridge
